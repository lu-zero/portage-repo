[package]
name = "portage-repo"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Luca Barbato <lu_zero@gentoo.org>"]
license = "MIT"
description = "Gentoo ebuild repository layout reader based on PMS"
repository = "https://github.com/lu-zero/portage-repo"
keywords = ["gentoo", "portage", "repository", "pms"]
categories = ["parser-implementations", "development-tools"]

[dependencies]
portage-atom = "0.6"
portage-metadata = "0.4"
gentoo-core = "0.4"
brush-core = { path = "../brush/brush-core", features = ["experimental-parser"] }
brush-builtins = { path = "../brush/brush-builtins" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt"] }
regex = "1"
thiserror = "2"
jwalk = "0.8.1"
flume = "0.12.0"
blake2 = "0.11.0-rc.5"
sha2 = "0.11"
hex = "0.4"
roxmltree = "0.21.1"
itertools = "0.14.0"

[dev-dependencies]
libc = "0.2"
md5 = "0.7"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = 1
lto = false

